[project]
name = "kukumind"
version = "1.0.0"
description = "KukuMind - your AI farm team, from egg to market. Seven Jac agents for Kenyan poultry farmers (English, Kiswahili, Sheng)."
entry-point = "main.jac"
kind = "fullstack"

# Python packages the server needs (installed by `jac install` / JacHammer)
[dependencies]
byllm = ">=0.6.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

# Run as ONE server (web page + agents together).
# Without this, Jac 0.16 auto-starts "microservice mode", which fails on this project.
[plugins.scale.microservices]
enabled = false
